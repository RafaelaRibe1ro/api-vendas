name: Build fornecedores-service

# Roda a cada push, em qualquer branch
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Baixa o codigo do repositorio
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Instala o Java 17 (com cache das dependencias do Maven)
      - name: Instala o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compila o fornecedores-service com o Maven
      - name: Compila com Maven
        run: mvn -B package -DskipTests
        working-directory: fornecedores-service
